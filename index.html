              `;
            }).join('')}
          </div>
        </section>

        <!-- Today's Routines Due -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Routines Due Today</h2>
            <span class="badge badge-muted">${scoreInfo.doneRoutines}/${scoreInfo.totalRoutines}</span>
          </div>
          ${snap.routines.length === 0
            ? `<p class="text-sm text-muted">No routines scheduled for today.</p>`
            : routineGroupsHtml
          }
        </section>
      `;
    }

    function dismissSampleBanner() {
      state.sampleBannerDismissed = true;
      saveState();
      renderCurrentView();
    }

    function toggleTodayBlock(blockId) {
      const todayKey = getLocalDateKey();
      const snap = getTodaySnapshot();
      const block = snap.blocks.find(b => b.id === blockId);
      if (!block) return;

      const win = getBlockWindowStatus(block, todayKey);
      if (!win.canToggle) {
        showToast(`Cannot change: ${win.label}`, 'danger');
        return;
      }

      if (!block.done) {
        block.done = true;
        block.doneAt = Date.now();
        playDisciplineChime(false);
        showToast(state.settings.strictMode ? 'Done! 30s window to undo if accidental.' : 'Block completed!', 'success');
      } else {
        block.done = false;
        block.doneAt = null;
        showToast('Unmarked block');
      }

      saveState();
      renderCurrentView();
    }

    function toggleTodayRoutine(routineId) {
      const todayKey = getLocalDateKey();
      const snap = getTodaySnapshot();
      const routine = snap.routines.find(r => r.id === routineId);
      if (!routine) return;

      const st = getRoutineStatus(routine, todayKey);
      if (!st.canToggle) {
        showToast('Locked: 30-second undo window has expired.', 'danger');
        return;
      }

      if (!routine.done) {
        routine.done = true;
        routine.doneAt = Date.now();
        playDisciplineChime(false);
        showToast(state.settings.strictMode ? 'Routine logged! 30s to undo.' : 'Routine completed!', 'success');
      } else {
        routine.done = false;
        routine.doneAt = null;
        showToast('Routine unmarked');
      }

      saveState();
      renderCurrentView();
    }

    /* ==========================================================================
       2. STUDY TAB RENDERER & ACTIONS
       ========================================================================== */
    function getStartOfWeekKey(dateKey) {
      const dt = parseDateKey(dateKey);
      const day = dt.getDay(); // 0=Sun..6=Sat
      const diffToMon = (day === 0 ? -6 : 1 - day);
      dt.setDate(dt.getDate() + diffToMon);
      return getLocalDateKey(dt);
    }

    function renderStudyTab() {
      const activeSem = state.semesters.find(s => s.id === state.activeSemesterId) || state.semesters[0];
      const subjects = activeSem ? activeSem.subjects : [];
      const t = state.activeTimer;
      if (!subjects.some(s => s.id === t.subjectId) && subjects.length > 0) {
        t.subjectId = subjects[0].id;
      }

      const elapsedMs = getElapsedTimerMs();
      const elapsedSec = Math.floor(elapsedMs / 1000);
      const targetSec = (t.modeMinutes || 0) * 60;
      const displaySec = targetSec > 0 ? Math.max(0, targetSec - elapsedSec) : elapsedSec;

      // Weekly minutes per subject (Mon-Sun)
      const weekStartKey = getStartOfWeekKey(getLocalDateKey());
      const weekEndKey = addDaysToKey(weekStartKey, 6);
      const subjectMinsMap = {};
      (state.studySessions || []).forEach(sess => {
        if (sess.dateKey >= weekStartKey && sess.dateKey <= weekEndKey) {
          subjectMinsMap[sess.subjectId] = (subjectMinsMap[sess.subjectId] || 0) + (sess.minutes || 0);
        }
      });

      const wakeLockSupported = 'wakeLock' in navigator;

      return `
        <header class="top-header">
          <div>
            <h1 style="font-size:22px; font-weight:700;">Deep Study</h1>
            <div class="text-xs text-muted mt-1">Timestamp-accurate focus timer & syllabus goals</div>
          </div>
          ${state.settings.strictMode ? `<span class="badge badge-accent">Strict Anti-Cheat ON</span>` : ''}
        </header>

        <!-- Focus Timer Card -->
        <section class="card">
          <div class="row-between mb-2">
            <span class="card-title">Focus Timer</span>
            <span class="badge ${wakeLockSupported ? 'badge-success' : 'badge-muted'}">
              ${wakeLockSupported ? 'Screen Wake Lock Ready' : 'Keep Screen On Manually'}
            </span>
          </div>

          <label class="field-label" for="study-subject-select">Subject</label>
          <select
            id="study-subject-select"
            class="select mb-3"
            ${t.running || elapsedSec > 0 ? 'disabled' : ''}
            onchange="setTimerSubject(this.value)"
          >
            ${subjects.length === 0
              ? `<option value="">Add a subject below first</option>`
              : subjects.map(sub => `<option value="${sub.id}" ${sub.id === t.subjectId ? 'selected' : ''}>${escapeHtml(sub.name)}</option>`).join('')
            }
          </select>

          <label class="field-label">Session Length</label>
          <div class="pill-group">
            ${[0, 25, 50, 90].map(m => `
              <button
                class="pill-choice ${t.modeMinutes === m ? 'active' : ''}"
                ${t.running || elapsedSec > 0 ? 'disabled' : ''}
                onclick="setTimerMode(${m})"
              >${m === 0 ? 'Free' : `${m}m`}</button>
            `).join('')}
          </div>

          <div id="focus-timer-clock" class="timer-display">${formatDurationMMSS(displaySec)}</div>

          <div class="row-between text-xs text-muted mb-3">
            <span>Elapsed: <strong id="focus-timer-elapsed">${Math.floor(elapsedSec / 60)}m ${elapsedSec % 60}s</strong></span>
            <span>Distractions: <strong style="color:${t.distractions > 0 ? 'var(--danger)' : 'inherit'};">${t.distractions || 0}</strong></span>
          </div>

          <div class="grid-2">
            ${!t.running
              ? `<button class="btn btn-primary" onclick="startFocusTimer()" ${subjects.length === 0 ? 'disabled' : ''}>${elapsedSec > 0 ? '▶ Resume' : '▶ Start Focus'}</button>`
              : `<button class="btn" onclick="pauseFocusTimer()">⏸ Pause</button>`
            }
            <button class="btn btn-success" onclick="finishFocusTimer(false)" ${elapsedSec === 0 ? 'disabled' : ''}>✓ Log Session</button>
          </div>
          ${elapsedSec > 0 ? `
            <button class="btn btn-sm btn-ghost mt-2" style="width:100%; color:var(--danger);" onclick="resetFocusTimer()">
              ${pendingConfirmKey === 'reset_timer' ? 'Tap again to confirm discard' : 'Discard Timer'}
            </button>
          ` : ''}

          ${state.settings.strictMode ? `
            <div class="text-xs text-muted mt-2" style="text-align:center;">
              Strict rules: Leaving app &gt;45s deducts time + logs distraction. Sessions &lt;5 min are discarded.
            </div>
          ` : ''}
        </section>

        <!-- Weekly Progress Per Subject -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Weekly Subject Progress</h2>
            <span class="text-xs text-muted">Mon–Sun</span>
          </div>
          ${subjects.length === 0
            ? `<p class="text-sm text-muted">No subjects in this semester yet.</p>`
            : subjects.map(sub => {
              const mins = subjectMinsMap[sub.id] || 0;
              const goalMins = (sub.weeklyGoalHours || 1) * 60;
              const pct = Math.min(100, Math.round((mins / goalMins) * 100));
              const hrsText = (mins / 60).toFixed(1);
              return `
                <div class="mb-3">
                  <div class="row-between text-sm mb-1">
                    <span class="font-semi">${escapeHtml(sub.name)}</span>
                    <span class="text-xs font-bold ${pct >= 100 ? '' : 'text-secondary'}" style="${pct >= 100 ? 'color:var(--success);' : ''}">
                      ${hrsText}h / ${sub.weeklyGoalHours}h (${pct}%)
                    </span>
                  </div>
                  <div class="progress-track">
                    <div class="progress-fill ${pct >= 100 ? 'success' : ''}" style="width:${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')
          }
        </section>

        <!-- Semesters & Subjects Manager -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Semesters & Subjects</h2>
            <button class="btn btn-sm btn-primary" onclick="createSemester()">+ Semester</button>
          </div>

          <div class="row mb-2">
            <select class="select" onchange="switchSemester(this.value)">
              ${state.semesters.map(s => `
                <option value="${s.id}" ${s.id === activeSem.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>
              `).join('')}
            </select>
            ${state.semesters.length > 1 ? `
              <button class="btn btn-sm btn-danger-outline" onclick="deleteActiveSemester()">
                ${pendingConfirmKey === 'del_sem' ? 'Confirm' : 'Delete'}
              </button>
            ` : ''}
          </div>

          ${activeSem ? `
            <div class="mb-3">
              <label class="field-label">Rename Active Semester</label>
              <input
                class="input"
                type="text"
                value="${escapeHtml(activeSem.name)}"
                onchange="renameActiveSemester(this.value)"
              />
            </div>

            <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;">Subjects & Weekly Hour Goals</div>
            ${activeSem.subjects.map(sub => `
              <div class="row mb-2">
                <input
                  class="input"
                  style="flex:2;"
                  type="text"
                  value="${escapeHtml(sub.name)}"
                  onchange="updateSubject('${sub.id}', 'name', this.value)"
                  aria-label="Subject name"
                />
                <input
                  class="input"
                  style="width:76px;"
                  type="number"
                  min="1"
                  max="60"
                  value="${sub.weeklyGoalHours}"
                  onchange="updateSubject('${sub.id}', 'weeklyGoalHours', this.value)"
                  aria-label="Weekly goal hours"
                />
                <span class="text-xs text-muted">h/wk</span>
                <button class="btn btn-icon btn-ghost" style="color:var(--danger);" onclick="removeSubject('${sub.id}')" aria-label="Remove subject">✕</button>
              </div>
            `).join('')}

            <form class="row mt-2" onsubmit="addSubject(event)">
              <input id="new-sub-name" class="input" style="flex:2;" type="text" placeholder="New subject name..." required />
              <input id="new-sub-hours" class="input" style="width:76px;" type="number" min="1" max="60" value="4" required />
              <button type="submit" class="btn btn-primary">Add</button>
            </form>
          ` : ''}
        </section>

        <!-- Exam Dates Manager -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Upcoming Exam Dates</h2>
          </div>
          ${(state.exams || []).length === 0
            ? `<p class="text-sm text-muted mb-2">No exams added yet.</p>`
            : state.exams
                .slice()
                .sort((a, b) => a.date.localeCompare(b.date))
                .map(ex => {
                  const diff = Math.ceil((parseDateKey(ex.date) - parseDateKey(getLocalDateKey())) / 86400000);
                  return `
                    <div class="block-row">
                      <div>
                        <div class="font-semi text-sm">${escapeHtml(ex.name)}</div>
                        <div class="text-xs text-muted">${ex.date} (${diff >= 0 ? `in ${diff} days` : 'Passed'})</div>
                      </div>
                      <button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="removeExam('${ex.id}')">Remove</button>
                    </div>
                  `;
                }).join('')
          }
          <form class="grid-3 mt-3" style="grid-template-columns: 1.5fr 1.2fr auto;" onsubmit="addExam(event)">
            <input id="new-exam-name" class="input" type="text" placeholder="Exam / Subject" required />
            <input id="new-exam-date" class="input" type="date" value="${addDaysToKey(getLocalDateKey(), 14)}" required />
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
        </section>
      `;
    }

    function setTimerSubject(subId) {
      state.activeTimer.subjectId = subId;
      saveState();
    }

    function setTimerMode(mins) {
      state.activeTimer.modeMinutes = mins;
      saveState();
      renderCurrentView();
    }

    function createSemester() {
      const newSem = {
        id: uid('sem'),
        name: `Semester ${state.semesters.length + 1}`,
        subjects: [{ id: uid('sub'), name: 'Core Subject 1', weeklyGoalHours: 5 }]
      };
      state.semesters.push(newSem);
      state.activeSemesterId = newSem.id;
      state.activeTimer.subjectId = newSem.subjects[0].id;
      saveState();
      showToast('Created new semester', 'success');
      renderCurrentView();
    }

    function switchSemester(semId) {
      state.activeSemesterId = semId;
      const sem = state.semesters.find(s => s.id === semId);
      if (sem && sem.subjects.length > 0 && !state.activeTimer.running) {
        state.activeTimer.subjectId = sem.subjects[0].id;
      }
      saveState();
      renderCurrentView();
    }

    function renameActiveSemester(newName) {
      const trimmed = newName.trim();
      if (!trimmed) return;
      const sem = state.semesters.find(s => s.id === state.activeSemesterId);
      if (sem) {
        sem.name = trimmed;
        saveState();
        showToast('Semester renamed');
      }
    }

    function deleteActiveSemester() {
      if (state.semesters.length <= 1) return;
      if (!requireTwoTapConfirm('del_sem', 'Tap Delete again to remove this semester')) return;
      state.semesters = state.semesters.filter(s => s.id !== state.activeSemesterId);
      state.activeSemesterId = state.semesters[0].id;
      saveState();
      showToast('Semester deleted');
      renderCurrentView();
    }

    function addSubject(e) {
      e.preventDefault();
      const nameEl = document.getElementById('new-sub-name');
      const hrsEl = document.getElementById('new-sub-hours');
      const name = nameEl.value.trim();
      const hrs = Math.max(1, Number(hrsEl.value) || 4);
      if (!name) return;

      const sem = state.semesters.find(s => s.id === state.activeSemesterId);
      if (!sem) return;
      const sub = { id: uid('sub'), name, weeklyGoalHours: hrs };
      sem.subjects.push(sub);
      if (!state.activeTimer.subjectId) state.activeTimer.subjectId = sub.id;
      saveState();
      showToast(`Added "${name}"`, 'success');
      renderCurrentView();
    }

    function updateSubject(subId, field, value) {
      const sem = state.semesters.find(s => s.id === state.activeSemesterId);
      if (!sem) return;
      const sub = sem.subjects.find(s => s.id === subId);
      if (!sub) return;
      if (field === 'name' && value.trim()) sub.name = value.trim();
      if (field === 'weeklyGoalHours') sub.weeklyGoalHours = Math.max(1, Number(value) || 1);
      saveState();
      renderCurrentView();
    }

    function removeSubject(subId) {
      const sem = state.semesters.find(s => s.id === state.activeSemesterId);
      if (!sem) return;
      sem.subjects = sem.subjects.filter(s => s.id !== subId);
      saveState();
      showToast('Subject removed');
      renderCurrentView();
    }

    function addExam(e) {
      e.preventDefault();
      const name = document.getElementById('new-exam-name').value.trim();
      const date = document.getElementById('new-exam-date').value;
      if (!name || !date) return;
      state.exams.push({ id: uid('ex'), name, date });
      saveState();
      showToast('Exam added', 'success');
      renderCurrentView();
    }

    function removeExam(id) {
      state.exams = state.exams.filter(ex => ex.id !== id);
      saveState();
      showToast('Exam removed');
      renderCurrentView();
    }

    /* ==========================================================================
       3. BODY TAB RENDERER & ACTIONS (GYM, DIET, WATER, WEIGHT)
       ========================================================================== */
    function renderBodyTab() {
      const todayKey = getLocalDateKey();
      const snap = getTodaySnapshot();

      // Gym stats
      const todayGym = (state.gymLogs || []).filter(g => g.dateKey === todayKey);
      const todayVolume = todayGym.reduce((sum, g) => sum + (g.sets * g.reps * g.kg), 0);

      const sevenDaysAgo = addDaysToKey(todayKey, -6);
      const gymDaySet = new Set(
        (state.gymLogs || [])
          .filter(g => g.dateKey >= sevenDaysAgo && g.dateKey <= todayKey)
          .map(g => g.dateKey)
      );

      // Unique past exercises for autocomplete
      const pastExercises = Array.from(new Set((state.gymLogs || []).map(g => g.exercise))).sort();

      // Historical max per exercise BEFORE each log entry (or current best)
      const exerciseBestMap = {};
      (state.gymLogs || []).forEach(g => {
        const key = g.exercise.trim().toLowerCase();
        if (!exerciseBestMap[key] || g.kg > exerciseBestMap[key]) {
          exerciseBestMap[key] = g.kg;
        }
      });

      // Diet stats
      const todayDiet = (state.dietLogs || []).filter(d => d.dateKey === todayKey);
      const totalKcal = todayDiet.reduce((s, d) => s + (d.kcal || 0), 0);
      const totalProtein = todayDiet.reduce((s, d) => s + (d.protein || 0), 0);
      const kcalTarget = state.settings.dailyCaloriesTarget || 2400;
      const protTarget = state.settings.dailyProteinTarget || 140;
      const kcalPct = Math.min(100, Math.round((totalKcal / kcalTarget) * 100));
      const protPct = Math.min(100, Math.round((totalProtein / protTarget) * 100));

      // Water
      const waterCount = snap.waterGlasses || 0;
      const waterTarget = state.settings.dailyWaterTarget || 8;

      // Weight Log (sorted chronological, last 30)
      const weights = (state.weightLogs || [])
        .slice()
        .sort((a, b) => a.dateKey.localeCompare(b.dateKey))
        .slice(-30);
      const todayWeightObj = weights.find(w => w.dateKey === todayKey);
      const netWeightChange = weights.length >= 2
        ? (weights[weights.length - 1].kg - weights[0].kg).toFixed(1)
        : null;

      return `
        <header class="top-header">
          <div>
            <h1 style="font-size:22px; font-weight:700;">Body & Fuel</h1>
            <div class="text-xs text-muted mt-1">Strength progression, macros, hydration & weight</div>
          </div>
        </header>

        <!-- GYM LOG -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">🏋️ Gym Log</h2>
            <div class="row">
              <span class="badge badge-accent">${todayVolume.toLocaleString()} kg vol</span>
              <span class="badge badge-success">${gymDaySet.size}d / 7d</span>
            </div>
          </div>

          <form onsubmit="addGymLog(event)">
            <div class="mb-2">
              <label class="field-label" for="gym-ex">Exercise</label>
              <input id="gym-ex" class="input" list="exercise-suggestions" placeholder="e.g. Bench Press, Squat, Lat Pulldown" required />
              <datalist id="exercise-suggestions">
                ${pastExercises.map(ex => `<option value="${escapeHtml(ex)}">`).join('')}
              </datalist>
            </div>
            <div class="grid-3 mb-2">
              <div>
                <label class="field-label" for="gym-sets">Sets</label>
                <input id="gym-sets" class="input" type="number" min="1" max="30" value="3" required />
              </div>
              <div>
                <label class="field-label" for="gym-reps">Reps</label>
                <input id="gym-reps" class="input" type="number" min="1" max="100" value="10" required />
              </div>
              <div>
                <label class="field-label" for="gym-kg">Weight (kg)</label>
                <input id="gym-kg" class="input" type="number" step="0.5" min="0" max="500" placeholder="60" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">+ Log Exercise</button>
          </form>

          ${todayGym.length > 0 ? `
            <div class="mt-3">
              <div class="text-xs font-bold text-muted mb-2" style="text-transform:uppercase;">Today's Lifts</div>
              ${todayGym.map(g => `
                <div class="block-row">
                  <div>
                    <div class="row">
                      <span class="font-semi text-sm">${escapeHtml(g.exercise)}</span>
                      ${g.isNewBest ? `<span class="badge badge-warning">★ New best!</span>` : ''}
                    </div>
                    <div class="text-xs text-secondary mt-1">
                      ${g.sets} sets × ${g.reps} reps @ <strong>${g.kg} kg</strong> (${(g.sets * g.reps * g.kg).toLocaleString()} kg)
                    </div>
                  </div>
                  <button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="deleteGymLog('${g.id}')">✕</button>
                </div>
              `).join('')}
            </div>
          ` : `<p class="text-xs text-muted mt-3">No sets logged today yet.</p>`}
        </section>

        <!-- DIET TRACKER -->
        <section class="card">
          <div class="card-header">

    function renderWeightSvgChart(weights) {
      if (weights.length < 2) {
        return `<p class="text-xs text-muted">Log at least 2 days of weight to view your trend chart.</p>`;
      }
      const W = 480;
      const H = 150;
      const padL = 38;
      const padR = 14;
      const padT = 16;
      const padB = 26;

      const vals = weights.map(w => w.kg);
      const minV = Math.min(...vals) - 0.5;
      const maxV = Math.max(...vals) + 0.5;
      const span = Math.max(0.5, maxV - minV);

      const pts = weights.map((w, idx) => {
        const x = padL + (idx / (weights.length - 1)) * (W - padL - padR);
        const y = padT + (1 - (w.kg - minV) / span) * (H - padT - padB);
        return { x, y, kg: w.kg, dateKey: w.dateKey };
      });

      const polylinePoints = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block; overflow:visible;">
          <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="var(--border)" stroke-dasharray="3 3"/>
          <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border)"/>
          <text x="2" y="${padT + 4}" fill="var(--text-muted)" font-size="10">${maxV.toFixed(1)}</text>
          <text x="2" y="${H - padB}" fill="var(--text-muted)" font-size="10">${minV.toFixed(1)}</text>
          <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${polylinePoints}" />
          ${pts.map(p => `
            <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.8" fill="var(--bg-surface)" stroke="var(--accent)" stroke-width="2.2" />
          `).join('')}
          <text x="${padL}" y="${H - 6}" fill="var(--text-muted)" font-size="10">${weights[0].dateKey.slice(5)}</text>
          <text x="${W - padR - 32}" y="${H - 6}" fill="var(--text-muted)" font-size="10">${weights[weights.length - 1].dateKey.slice(5)}</text>
        </svg>
      `;
    }

    function addGymLog(e) {
      e.preventDefault();
      const exercise = document.getElementById('gym-ex').value.trim();
      const sets = Math.max(1, Number(document.getElementById('gym-sets').value) || 1);
      const reps = Math.max(1, Number(document.getElementById('gym-reps').value) || 1);
      const kg = Math.max(0, Number(document.getElementById('gym-kg').value) || 0);
      if (!exercise) return;

      const norm = exercise.toLowerCase();
      const prevBest = (state.gymLogs || [])
        .filter(g => g.exercise.trim().toLowerCase() === norm)
        .reduce((max, g) => Math.max(max, g.kg), 0);

      const isNewBest = kg > prevBest && kg > 0;

      state.gymLogs.push({
        id: uid('gym'),
        dateKey: getLocalDateKey(),
        exercise,
        sets,
        reps,
        kg,
        isNewBest
      });
      saveState();
      showToast(isNewBest ? `★ New best on ${exercise}: ${kg} kg!` : `Logged ${exercise}`, 'success');
      renderCurrentView();
    }

    function deleteGymLog(id) {
      state.gymLogs = state.gymLogs.filter(g => g.id !== id);
      saveState();
      renderCurrentView();
    }

    function addDietLog(e) {
      e.preventDefault();
      const name = document.getElementById('diet-name').value.trim();
      const kcal = Math.max(0, Number(document.getElementById('diet-kcal').value) || 0);
      const protein = Math.max(0, Number(document.getElementById('diet-prot').value) || 0);
      if (!name) return;

      state.dietLogs.push({
        id: uid('diet'),
        dateKey: getLocalDateKey(),
        name,
        kcal,
        protein

      saveState();
      showToast(`Logged ${name}`, 'success');
      renderCurrentView();
    }

      state.dietLogs = state.dietLogs.filter(d => d.id !== id);
      saveState();

    function adjustWater(delta) {
      const snap = getTodaySnapshot();
      snap.waterGlasses = Math.max(0, (snap.waterGlasses || 0) + delta);
      saveState();
      renderCurrentView();
    }

    function saveTodayWeight(e) {
      e.preventDefault();
      const val = Number(document.getElementById('weight-input').value);
      if (!val || val <= 0) return;
      const todayKey = getLocalDateKey();
      const existing = state.weightLogs.find(w => w.dateKey === todayKey);
      if (existing) {
        existing.kg = val;
      } else {
        state.weightLogs.push({ dateKey: todayKey, kg: val });
      }
      saveState();
      showToast(`Saved weight: ${val} kg`, 'success');
      renderCurrentView();
    }

          return `
            <section class="card">

                          <div class="grid-2 mb-2">
                            <select class="select" onchange="updateRoutineField('${r.id}', 'group', this.value)">
                              ${CARE_GROUPS.map(g => `<option value="${g}" ${g === r.group ? 'selected' : ''}>${g}</option>`).join('')}
                            </select>
                            <select class="select" onchange="updateRoutineField('${r.id}', 'timeOfDay', this.value)">

                            </button>
                            <button type="button" class="btn btn-sm btn-primary" onclick="setEditingRoutine(null)">Done Editing</button>
                          </div>
                        </div>
                      ` : `
                        <div class="row-between">
                          <div>
                            <div class="font-semi text-sm">${escapeHtml(r.name)}</div>
                            <div class="row mt-1">

                              const isDue = r.days[dow];
                              const snap = state.days[dk];
                              const snapR = snap && snap.routines ? snap.routines.find(sr => sr.id === r.id) : null;
                              let cls = 'not-due';
                              let symbol = '·';
                              if (snapR) {
                                if (snapR.done) {
                                  cls = 'done';
                                  symbol = '✓';
                                } else if (dk < todayKey) {
                                  cls = 'missed';
                                  symbol = '✕';
                                } else {
                                  cls = 'pending';
                                  symbol = '•';

                            }).join('')}
                          </div>

    function addRoutine(e) {

      const name = document.getElementById('new-routine-name').value.trim();
      const group = document.getElementById('new-routine-group').value;
      const timeOfDay = document.getElementById('new-routine-tod').value;
      if (!name) return;
      if (!newRoutineDays.some(Boolean)) {
        showToast('Select at least one weekday.', 'danger');
        return;
      }

      state.routines.push({
        id: uid('r'),
        name,
        group,
        timeOfDay,
        days: [...newRoutineDays]
      });
      newRoutineDays = [true, true, true, true, true, true, true];
      saveState();
      showToast('Routine added (applies from tomorrow)', 'success');
      renderCurrentView();
    }

    function setEditingRoutine(id) {
      editingRoutineId = id;
      renderCurrentView();
    }

    function updateRoutineField(id, field, val) {
      const r = state.routines.find(item => item.id === id);
      if (!r) return;
      if (field === 'name' && !val.trim()) return;
      r[field] = val.trim ? val.trim() : val;
      saveState();
      renderCurrentView();
    }

    function toggleRoutineDay(id, dayIdx) {
      const r = state.routines.find(item => item.id === id);
      if (!r) return;
      r.days[dayIdx] = !r.days[dayIdx];
      saveState();
      renderCurrentView();
    }

    function deleteRoutine(id) {
      if (!requireTwoTapConfirm(`del_r_${id}`, 'Tap Confirm Delete to remove routine')) return;
      state.routines = state.routines.filter(r => r.id !== id);
      editingRoutineId = null;
      saveState();
      showToast('Routine deleted');
      renderCurrentView();
    }

       ========================================================================== */

    function createTimetable() {
      const id = uid('tt');
      state.timetables[id] = {
        id,
        name: `Custom Plan ${Object.keys(state.timetables).length + 1}`,
        blocks: [
          { id: uid('b'), start: '07:00', end: '08:00', title: 'Morning Routine', category: 'Care' },
          { id: uid('b'), start: '09:00', end: '12:00', title: 'Deep Work / Study', category: 'Study' }
        ]
      };
      state.selectedPlanTimetableId = id;
      saveState();
      showToast('Created new timetable', 'success');
      renderCurrentView();

    function duplicateTimetable() {
      const src = state.timetables[state.selectedPlanTimetableId];
      if (!src) return;
      const id = uid('tt');
      state.timetables[id] = {
        id,
        name: `${src.name} (Copy)`,
        blocks: src.blocks.map(b => ({ ...b, id: uid('b') }))
      };
      state.selectedPlanTimetableId = id;
      saveState();
      showToast('Timetable duplicated', 'success');
      renderCurrentView();
    }

    function renameTimetable(newName) {
      const trimmed = newName.trim();
      if (!trimmed) return;
      const tt = state.timetables[state.selectedPlanTimetableId];
      if (tt) {
        tt.name = trimmed;
        saveState();
        showToast('Timetable renamed');
        renderCurrentView();
      }

    function deleteTimetable() {
      const keys = Object.keys(state.timetables);
      if (keys.length <= 1) return;
      if (!requireTwoTapConfirm('del_tt', 'Tap Confirm again to delete this timetable')) return;

      const delId = state.selectedPlanTimetableId;
      delete state.timetables[delId];
      const fallbackId = Object.keys(state.timetables)[0];
      state.selectedPlanTimetableId = fallbackId;

      for (let i = 0; i < 7; i++) {
        if (state.weekdayTimetables[i] === delId) state.weekdayTimetables[i] = fallbackId;
      }
      if (state.examPeriod.timetableId === delId) state.examPeriod.timetableId = fallbackId;

      saveState();
      showToast('Timetable deleted');
      renderCurrentView();
    }

    function addTimetableBlock() {
      const tt = state.timetables[state.selectedPlanTimetableId];
      if (!tt) return;
      tt.blocks.push({
        id: uid('b'),
        start: '12:00',
        end: '13:00',
        title: 'New Scheduled Block',
        category: 'Study'
      });
      saveState();
      showToast('Block added (applies from tomorrow)');
      renderCurrentView();
    }

    function updateTimetableBlock(blockId, field, value) {
      const tt = state.timetables[state.selectedPlanTimetableId];
      if (!tt) return;
      const block = tt.blocks.find(b => b.id === blockId);
      if (!block) return;
      if (field === 'title' && !value.trim()) return;
      block[field] = field === 'title' ? value.trim() : value;
      saveState();
      renderCurrentView();
    }

    function removeTimetableBlock(blockId) {
      const tt = state.timetables[state.selectedPlanTimetableId];
      if (!tt) return;
      tt.blocks = tt.blocks.filter(b => b.id !== blockId);
      saveState();
      showToast('Block removed');
      renderCurrentView();
    }

    function assignWeekdayTimetable(dow, ttId) {
      state.weekdayTimetables[dow] = ttId;
      saveState();
      showToast(`Updated ${WEEKDAY_NAMES[dow]}`);
    }

    function toggleExamPeriod(enabled) {
      state.examPeriod.enabled = enabled;
      saveState();
      showToast(enabled ? 'Exam period override enabled' : 'Exam period override disabled');
      renderCurrentView();
    }

    function updateExamPeriod(field, val) {
      state.examPeriod[field] = val;
      saveState();
    }

    /* ==========================================================================
       6. STATS TAB RENDERER & ACTIONS
       ========================================================================== */
    function renderStatsTab() {
      const todayKey = getLocalDateKey();
      const streaks = computeStreaks();
      const threshold = state.settings.streakThreshold || 80;

      // Last 28 days for Heatmap & Avg Score
      const last28Keys = Array.from({ length: 28 }, (_, i) => addDaysToKey(todayKey, i - 27));
      let trackedDaysCount = 0;
      let scoreSum = 0;

      const heatCells = last28Keys.map(dk => {
        const snap = state.days[dk];
        const dayNum = Number(dk.split('-')[2]);
        if (!snap) {
          return { dk, dayNum, score: null, status: 'empty' };
        }
        const sc = calculateDayScore(snap).score;
        trackedDaysCount += 1;
        scoreSum += sc;
        let status = 'missed';
        if (sc >= threshold) status = 'qualifies';
        else if (sc > 0) status = 'partial';
        return { dk, dayNum, score: sc, status };
      });

      const avgScore = trackedDaysCount > 0 ? Math.round(scoreSum / trackedDaysCount) : 0;

      // Study time last 7 days
      const last7Keys = Array.from({ length: 7 }, (_, i) => addDaysToKey(todayKey, i - 6));
      const dailyStudy7 = last7Keys.map(dk => {
        const snapMins = state.days[dk] ? (state.days[dk].studyMinutesLogged || 0) : 0;
        const sessMins = (state.studySessions || [])
          .filter(s => s.dateKey === dk)
          .reduce((sum, s) => sum + (s.minutes || 0), 0);
        return {
          dk,
          label: parseDateKey(dk).toLocaleDateString(undefined, { weekday: 'narrow' }),
          mins: Math.max(snapMins, sessMins)
        };
      });
      const totalStudy7Mins = dailyStudy7.reduce((s, d) => s + d.mins, 0);
      const study7Formatted = `${Math.floor(totalStudy7Mins / 60)}h ${totalStudy7Mins % 60}m`;

      // Gym sessions this week (Mon-Sun)
      const weekStartKey = getStartOfWeekKey(todayKey);
      const gymSessionsThisWeek = new Set(
        (state.gymLogs || [])
          .filter(g => g.dateKey >= weekStartKey && g.dateKey <= todayKey)
          .map(g => g.dateKey)
      ).size;

      // Selected day inspection card (read-only)
      const inspectedSnap = state.days[selectedStatsDateKey];
      const inspectedScore = inspectedSnap ? calculateDayScore(inspectedSnap) : null;

      return `
        <header class="top-header">
          <div>
            <h1 style="font-size:22px; font-weight:700;">Discipline Analytics</h1>
            <div class="text-xs text-muted mt-1">Consistency, focus volume & 28-day accountability</div>
          </div>
        </header>

        <!-- KPI Grid -->
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="text-xs text-muted font-semi">Current Streak</div>
            <div class="kpi-val">🔥 ${streaks.current}d</div>
          </div>
          <div class="kpi-box">
            <div class="text-xs text-muted font-semi">Best Streak</div>
            <div class="kpi-val">🏆 ${streaks.best}d</div>
          </div>
          <div class="kpi-box">
            <div class="text-xs text-muted font-semi">Avg Score (28d)</div>
            <div class="kpi-val">${avgScore}%</div>
          </div>
          <div class="kpi-box">
            <div class="text-xs text-muted font-semi">Study (Last 7d)</div>
            <div class="kpi-val">${study7Formatted}</div>
          </div>
        </div>

        <div class="card" style="padding:12px 16px;">
          <div class="row-between">
            <span class="text-sm font-semi">🏋️ Gym Sessions This Week (Mon–Sun)</span>
            <span class="badge badge-success">${gymSessionsThisWeek} session${gymSessionsThisWeek === 1 ? '' : 's'}</span>
          </div>
        </div>

        <!-- 28-Day Heatmap -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">28-Day Discipline Heatmap</h2>
            <span class="badge badge-success">Green = ${threshold}%+</span>
          </div>
          <div class="heatmap-grid">
            ${heatCells.map(cell => `
              <button
                type="button"
                class="heat-cell ${cell.status} ${selectedStatsDateKey === cell.dk ? 'selected' : ''}"
                onclick="selectStatsDay('${cell.dk}')"
                title="${cell.dk}: ${cell.score !== null ? cell.score + '%' : 'No data'}"
              >
                <span>${cell.dayNum}</span>
                <span style="font-size:9px; opacity:0.9;">${cell.score !== null ? cell.score + '%' : '—'}</span>
              </button>
            `).join('')}
          </div>

          <!-- Read-only Day Inspector -->
          <div class="mt-3" style="padding:10px 12px; border-radius:var(--radius-md); background:var(--bg-app); border:1px solid var(--border);">
            <div class="row-between">
              <strong class="text-sm">${formatDisplayDate(selectedStatsDateKey)} ${selectedStatsDateKey < todayKey ? '(Read-Only)' : '(Today)'}</strong>
              ${inspectedScore
                ? `<span class="badge ${inspectedScore.score >= threshold ? 'badge-success' : 'badge-muted'}">${inspectedScore.score}% Score</span>`
                : `<span class="badge badge-muted">No Record</span>`
              }
            </div>
            ${inspectedSnap ? `
              <div class="text-xs text-secondary mt-1">
                Timetable: <strong>${escapeHtml(inspectedSnap.timetableName)}</strong> •
                Blocks: ${inspectedScore.doneBlocks}/${inspectedScore.totalBlocks} •
                Routines: ${inspectedScore.doneRoutines}/${inspectedScore.totalRoutines} •
                Study: ${inspectedSnap.studyMinutesLogged || 0}/${inspectedSnap.studyGoalMin}m
              </div>
            ` : `<div class="text-xs text-muted mt-1">App was not opened on this date.</div>`}
          </div>
        </section>

        <!-- 7-Day Study Minutes Bar Chart -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Study Minutes (Last 7 Days)</h2>
            <span class="text-xs text-muted">Goal: ${state.settings.dailyStudyGoalMin}m</span>
          </div>
          ${renderStudyBarChartSvg(dailyStudy7, state.settings.dailyStudyGoalMin || 90)}
        </section>
      `;
    }

    function selectStatsDay(dk) {
      selectedStatsDateKey = dk;
      renderCurrentView();
    }

    function renderStudyBarChartSvg(daysData, goalMins) {
      const W = 480;
      const H = 160;
      const padL = 32;
      const padR = 12;
      const padT = 18;
      const padB = 26;

      const maxVal = Math.max(goalMins * 1.2, ...daysData.map(d => d.mins), 60);
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;
      const barSlot = plotW / daysData.length;
      const barW = Math.min(34, barSlot * 0.58);

      const goalY = padT + (1 - goalMins / maxVal) * plotH;

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
          <line x1="${padL}" y1="${goalY.toFixed(1)}" x2="${W - padR}" y2="${goalY.toFixed(1)}" stroke="var(--success)" stroke-dasharray="4 3" stroke-width="1.5" />
          <text x="2" y="${goalY.toFixed(1)}" fill="var(--success)" font-size="9" font-weight="700">${goalMins}</text>
          <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--border)" />

          ${daysData.map((d, i) => {
            const barH = (d.mins / maxVal) * plotH;
            const x = padL + i * barSlot + (barSlot - barW) / 2;
            const y = H - padB - barH;
            const met = d.mins >= goalMins;
            return `
              <rect
                x="${x.toFixed(1)}" y="${y.toFixed(1)}"
                width="${barW.toFixed(1)}" height="${Math.max(2, barH).toFixed(1)}"
                rx="5"
                fill="${met ? 'var(--success)' : 'var(--accent)'}"
              />
              ${d.mins > 0 ? `
                <text x="${(x + barW / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" fill="var(--text-secondary)" font-size="9" font-weight="700">${d.mins}</text>
              ` : ''}
              <text x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="var(--text-muted)" font-size="11" font-weight="600">${d.label}</text>
            `;
          }).join('')}
        </svg>
      `;
    }

    /* ==========================================================================
       7. SETTINGS SCREEN RENDERER & ACTIONS
       ========================================================================== */
    function renderSettings() {
      const container = document.getElementById('settings-content');
      if (!container) return;

      const s = state.settings;
      const locked = isStrictModeLocked();
      const notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';

      container.innerHTML = `
        <div class="top-header">
          <h1 style="font-size:22px; font-weight:700;">Settings</h1>
          <button class="btn" onclick="closeSettings()">✕ Close</button>
        </div>

        <!-- Strict Mode Anti-Cheating Card -->
        <section class="card">
          <div class="row-between mb-2">
            <div>
              <h2 class="card-title">🛡️ Strict Mode (Anti-Cheat)</h2>
              <div class="text-xs text-muted mt-1">
                ${s.strictMode
                  ? (locked ? `Locked ON for ${getStrictLockRemainingText()}` : '7-day lock period completed (can turn off)')
                  : 'Currently OFF — turning ON locks it for 7 days'
                }
              </div>
            </div>
            <button
              class="btn ${s.strictMode ? 'btn-primary' : ''}"
              ${s.strictMode && locked ? 'disabled' : ''}
              onclick="toggleStrictMode()"
            >
              ${s.strictMode ? (locked ? '🔒 Locked ON' : 'Turn OFF') : 'Turn ON'}
            </button>
          </div>
          <p class="text-xs text-secondary">
            Enforces task time windows (+1h grace), 30s undo limit, study distraction penalties (&gt;45s away), 5m minimum study sessions, and a 7-day lock against disabling.
          </p>
        </section>

        <!-- Appearance & Alerts -->
        <section class="card">
          <h2 class="card-title mb-3">Appearance & Alerts</h2>
          <label class="field-label">Color Theme</label>
          <div class="grid-3 mb-3">
            ${['system', 'light', 'dark'].map(th => `
              <button
                class="pill-choice ${s.theme === th ? 'active' : ''}"
                onclick="setThemePreference('${th}')"
                style="text-transform:capitalize;"
              >${th}</button>
            `).join('')}
          </div>

          <div class="row-between mb-2">
            <div>
              <div class="text-sm font-semi">Browser Notifications</div>
              <div class="text-xs text-muted">Status: ${notifPerm}</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="requestBrowserNotifications()">
              ${notifPerm === 'granted' ? '✓ Enabled' : 'Request Permission'}
            </button>
          </div>

          <div class="row-between mt-3">
            <div>
              <div class="text-sm font-semi">In-App Discipline Chime</div>
              <div class="text-xs text-muted">Subtle audio alert on warnings & completions</div>
            </div>
            <input
              type="checkbox"
              style="width:22px; height:22px;"
              ${s.soundAlerts ? 'checked' : ''}
              onchange="updateSetting('soundAlerts', this.checked)"
            />
          </div>
        </section>

        <!-- Daily Targets -->
        <section class="card">
          <h2 class="card-title mb-3">Daily Targets</h2>
          <div class="grid-2 mb-2">
            <div>
              <label class="field-label">Streak Threshold (%)</label>
              <input class="input" type="number" min="50" max="100" value="${s.streakThreshold}" onchange="updateSetting('streakThreshold', Number(this.value))" />
            </div>
            <div>
              <label class="field-label">Daily Study Goal (min)</label>
              <input class="input" type="number" min="15" max="720" value="${s.dailyStudyGoalMin}" onchange="updateSetting('dailyStudyGoalMin', Number(this.value))" />
            </div>
          </div>
          <div class="grid-3">
            <div>
              <label class="field-label">Calories (kcal)</label>
              <input class="input" type="number" min="800" max="8000" value="${s.dailyCaloriesTarget}" onchange="updateSetting('dailyCaloriesTarget', Number(this.value))" />
            </div>
            <div>
              <label class="field-label">Protein (g)</label>
              <input class="input" type="number" min="20" max="500" value="${s.dailyProteinTarget}" onchange="updateSetting('dailyProteinTarget', Number(this.value))" />
            </div>
            <div>
              <label class="field-label">Water (glasses)</label>
              <input class="input" type="number" min="1" max="30" value="${s.dailyWaterTarget}" onchange="updateSetting('dailyWaterTarget', Number(this.value))" />
            </div>
          </div>
          <div class="text-xs text-muted mt-2">
            Note: Study goal changes apply starting tomorrow so today's snapshot stays fair.
          </div>
        </section>

        <!-- Backup & Restore -->
        <section class="card">
          <h2 class="card-title mb-2">Backup & Restore (JSON)</h2>
          <p class="text-xs text-muted mb-2">
            All data lives locally in your browser. Copy a JSON backup regularly to move devices or prevent data loss.
          </p>
          <button class="btn btn-primary mb-2" style="width:100%;" onclick="copyBackupJson()">Copy Backup to Clipboard</button>

          ${backupFallbackVisible ? `
            <div class="mb-3">
              <label class="field-label">Backup JSON (Select all & copy manually if needed)</label>
              <textarea id="backup-export-box" class="textarea" readonly onclick="this.select()">${escapeHtml(JSON.stringify(state))}</textarea>
            </div>
          ` : ''}

          <label class="field-label mt-2">Restore from JSON</label>
          <textarea id="backup-import-box" class="textarea mb-2" placeholder="Paste your Daily Discipline JSON backup here..."></textarea>
          <button class="btn" style="width:100%;" onclick="restoreBackupJson()">Restore Backup</button>
        </section>

        <!-- Danger Zone: Two-Tap Reset -->
        <section class="card" style="border-color:rgba(239, 68, 68, 0.4);">
          <h2 class="card-title mb-2" style="color:var(--danger);">Danger Zone</h2>
          <p class="text-xs text-muted mb-3">
            Erase all tracked days, streaks, logs, and custom timetables, restoring fresh sample data.
          </p>
          <button class="btn btn-danger" style="width:100%;" onclick="resetAllAppData()">
            ${pendingConfirmKey === 'reset_all_data' ? '⚠️ Tap Again to Permanently Erase Everything' : 'Reset All Data'}
          </button>
        </section>
      `;
    }

    function toggleStrictMode() {
      if (state.settings.strictMode) {
        if (isStrictModeLocked()) {
          showToast(`Locked for ${getStrictLockRemainingText()}`, 'danger');
          return;
        }
        state.settings.strictMode = false;
        showToast('Strict Mode turned OFF');
      } else {
        state.settings.strictMode = true;
        state.settings.strictEnabledAt = Date.now();
        showToast('Strict Mode ON — locked for 7 days!', 'success');
      }
      saveState();
      renderSettings();
    }

    function setThemePreference(theme) {
      state.settings.theme = theme;
      applyTheme();
      saveState();
      renderSettings();
    }

    function updateSetting(key, val) {
      if (typeof val === 'number' && (isNaN(val) || val <= 0)) return;
      state.settings[key] = val;
      saveState();
      showToast('Setting saved');
    }

    async function copyBackupJson() {
      const jsonStr = JSON.stringify(state);
      backupFallbackVisible = true;
      renderSettings();

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(jsonStr);
          showToast('Backup JSON copied to clipboard!', 'success');
          return;
        }
      } catch (e) {}

      // Legacy fallback
      const box = document.getElementById('backup-export-box');
      if (box) {
        box.focus();
        box.select();
        try {
          document.execCommand('copy');
          showToast('Backup JSON copied!', 'success');
        } catch (err) {
          showToast('Clipboard blocked — copy directly from the box below.', 'danger');
        }
      }
    }

    function restoreBackupJson() {
      const box = document.getElementById('backup-import-box');
      if (!box || !box.value.trim()) {
        showToast('Paste backup JSON first.', 'danger');
        return;
      }
      try {
        const parsed = JSON.parse(box.value.trim());
        if (!parsed || typeof parsed !== 'object' || !parsed.settings || !parsed.timetables) {
          throw new Error('Missing required fields');
        }
        state = parsed;
        ensureDaySnapshot(state, getLocalDateKey());
        applyTheme();
        saveState();
        showToast('Backup restored successfully!', 'success');
        closeSettings();
      } catch (e) {
        showToast('Invalid JSON backup file. Restore aborted.', 'danger');
      }
    }

    function resetAllAppData() {
      if (!requireTwoTapConfirm('reset_all_data', 'Tap Reset All Data again to confirm erase')) return;
      state = createDefaultState();
      ensureDaySnapshot(state, getLocalDateKey());
      applyTheme();
      saveState();
      backupFallbackVisible = false;
      showToast('All data reset to default sample schedule.', 'success');
      closeSettings();
    }

    /* ==========================================================================
       LIVE TICKERS (1s TIMER & UNDO COUNTDOWN + 15s DISCIPLINE MONITOR)
       ========================================================================== */
    setInterval(() => {
      // 1. Live Focus Timer tick
      const t = state.activeTimer;
      if (t && t.running) {
        const elapsedMs = getElapsedTimerMs();
        const elapsedSec = Math.floor(elapsedMs / 1000);
        const targetSec = (t.modeMinutes || 0) * 60;

        if (targetSec > 0 && elapsedSec >= targetSec) {
          finishFocusTimer(true);
          return;
        }

        if (activeTab === 'study') {
          const clockEl = document.getElementById('focus-timer-clock');
          const elapEl = document.getElementById('focus-timer-elapsed');
          if (clockEl) {
            const dispSec = targetSec > 0 ? Math.max(0, targetSec - elapsedSec) : elapsedSec;
            clockEl.textContent = formatDurationMMSS(dispSec);
          }
          if (elapEl) {
            elapEl.textContent = `${Math.floor(elapsedSec / 60)}m ${elapsedSec % 60}s`;
          }
        }
      }

      // 2. Live 30-second Undo countdown update on Today tab
      if (activeTab === 'today' && state.settings.strictMode) {
        const snap = getTodaySnapshot();
        const now = Date.now();
        const hasActiveUndo =
          snap.blocks.some(b => b.done && b.doneAt && (now - b.doneAt) <= UNDO_WINDOW_MS + 1000) ||
          snap.routines.some(r => r.done && r.doneAt && (now - r.doneAt) <= UNDO_WINDOW_MS + 1000);
        if (hasActiveUndo) {
          renderCurrentView();
        }
      }
    }, 1000);

    // Every 15 seconds: check deadlines, warnings, notifications & date rollover
    setInterval(() => {
      const todayKey = getLocalDateKey();
      const wasNewDay = !state.days[todayKey];
      ensureDaySnapshot(state, todayKey);
      runDisciplineMonitor();
      if (wasNewDay || activeTab === 'today') {
        renderCurrentView();
      }
    }, 15000);

    /* ==========================================================================
       INITIALIZATION
       ========================================================================== */
    applyTheme();
    renderCurrentView();
    runDisciplineMonitor();
    if (state.activeTimer && state.activeTimer.running) {
      engageWakeLock();
    }
  </script>
</body>
</html>
