<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Daily Discipline</title>
  <link rel="manifest" href="manifest.json" />
  <!-- Google Fonts: Space Grotesk for headings, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME TOKENS
       ========================================================================== */
    :root {
      --bg-app: #f4f6fa;
      --bg-surface: #ffffff;
      --bg-surface-2: #eef2f8;
      --bg-nav: rgba(255, 255, 255, 0.92);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.12);

      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.13);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);

      /* Category Badges */
      --cat-study: #2563eb;
      --cat-study-bg: rgba(37, 99, 235, 0.12);
      --cat-gym: #ea580c;
      --cat-gym-bg: rgba(234, 88, 12, 0.12);
      --cat-care: #8b5cf6;
      --cat-care-bg: rgba(139, 92, 246, 0.12);
      --cat-diet: #059669;
      --cat-diet-bg: rgba(5, 150, 105, 0.12);
      --cat-college: #0284c7;
      --cat-college-bg: rgba(2, 132, 199, 0.12);
      --cat-rest: #64748b;
      --cat-rest-bg: rgba(100, 116, 139, 0.12);

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.07);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-app: #090d16;
        --bg-surface: #111827;
        --bg-surface-2: #1e293b;
        --bg-nav: rgba(17, 24, 39, 0.92);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border: #1e293b;
        --border-strong: #334155;

        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.18);

        --success: #10b981;
        --success-soft: rgba(16, 185, 129, 0.18);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.18);
        --warning: #fbbf24;
        --warning-soft: rgba(251, 191, 36, 0.18);

        --cat-study: #60a5fa;
        --cat-study-bg: rgba(59, 130, 246, 0.18);
        --cat-gym: #fb923c;
        --cat-gym-bg: rgba(249, 115, 22, 0.18);
        --cat-care: #a78bfa;
        --cat-care-bg: rgba(139, 92, 246, 0.18);
        --cat-diet: #34d399;
        --cat-diet-bg: rgba(16, 185, 129, 0.18);
        --cat-college: #38bdf8;
        --cat-college-bg: rgba(14, 165, 233, 0.18);
        --cat-rest: #94a3b8;
        --cat-rest-bg: rgba(148, 163, 184, 0.18);

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
      }
    }

    :root[data-theme="dark"] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-2: #1e293b;
      --bg-nav: rgba(17, 24, 39, 0.92);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-strong: #334155;

      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.18);

      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.18);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.18);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.18);

      --cat-study: #60a5fa;
      --cat-study-bg: rgba(59, 130, 246, 0.18);
      --cat-gym: #fb923c;
      --cat-gym-bg: rgba(249, 115, 22, 0.18);
      --cat-care: #a78bfa;
      --cat-care-bg: rgba(139, 92, 246, 0.18);
      --cat-diet: #34d399;
      --cat-diet-bg: rgba(16, 185, 129, 0.18);
      --cat-college: #38bdf8;
      --cat-college-bg: rgba(14, 165, 233, 0.18);
      --cat-rest: #94a3b8;
      --cat-rest-bg: rgba(148, 163, 184, 0.18);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    /* ==========================================================================
       RESET & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      letter-spacing: -0.02em;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       LAYOUT SHELL
       ========================================================================== */
    .app-container {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding-top: calc(12px + var(--safe-top));
      padding-bottom: calc(88px + var(--safe-bottom));
      padding-left: 14px;
      padding-right: 14px;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================================================
       BUTTONS & INPUTS (>= 42px TAP TARGETS)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn-danger-outline {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-surface-2);
    }

    .btn-sm {
      min-height: 36px;
      padding: 0 10px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    .btn-icon {
      width: 42px;
      min-width: 42px;
      padding: 0;
    }

    .input, .select, .textarea {
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      color: var(--text-primary);
      transition: border-color 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
    }

    .textarea {
      min-height: 90px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    /* ==========================================================================
       BADGES & PILLS
       ========================================================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }

    .badge-accent { background: var(--accent-soft); color: var(--accent); }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-muted { background: var(--bg-surface-2); color: var(--text-muted); }

    .cat-Study { background: var(--cat-study-bg); color: var(--cat-study); }
    .cat-Gym { background: var(--cat-gym-bg); color: var(--cat-gym); }
    .cat-Care { background: var(--cat-care-bg); color: var(--cat-care); }
    .cat-Diet { background: var(--cat-diet-bg); color: var(--cat-diet); }
    .cat-College { background: var(--cat-college-bg); color: var(--cat-college); }
    .cat-Rest { background: var(--cat-rest-bg); color: var(--cat-rest); }

    /* ==========================================================================
       BANNERS & WARNINGS STRIP
       ========================================================================== */
    .banner {
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      border: 1px solid var(--border);
    }

    .banner-info {
      background: var(--accent-soft);
      border-color: rgba(37, 99, 235, 0.3);
      color: var(--text-primary);
    }

    .banner-warning {
      background: var(--warning-soft);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--text-primary);
    }

    .banner-danger {
      background: var(--danger-soft);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--text-primary);
    }

    .alerts-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      border-left: 4px solid var(--warning);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .alert-item.urgent {
      border-left-color: var(--danger);
      background: var(--danger-soft);
    }

    .alert-item.info {
      border-left-color: var(--accent);
    }

    /* ==========================================================================
       BOTTOM NAVIGATION BAR
       ========================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-nav);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }

    .bottom-nav-inner {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 4px 6px;
      gap: 2px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 4px 2px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      gap: 3px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.1;
    }

    .nav-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ==========================================================================
       TODAY TAB SPECIFICS
       ========================================================================== */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .hero-score-card {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ring-wrapper {
      position: relative;
      width: 116px;
      height: 116px;
      flex-shrink: 0;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-pct {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }

    .ring-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 600;
    }

    .streak-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .streak-pill {
      background: var(--bg-surface-2);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chips-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .chips-scroll::-webkit-scrollbar {
      display: none;
    }

    .exam-chip {
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    /* Task / Timetable Block Row */
    .block-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-app);
      margin-bottom: 8px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .block-row:last-child {
      margin-bottom: 0;
    }

    .block-row.is-current {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .block-row.is-done {
      opacity: 0.78;
    }

    .block-row.is-done .block-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .block-row.is-missed {
      border-color: rgba(239, 68, 68, 0.35);
      background: var(--danger-soft);
    }

    .check-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 12px;
      border: 2px solid var(--border-strong);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: transparent;
      transition: all 0.15s ease;
    }

    .check-btn.checked {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .check-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--bg-surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-fill.success {
      background: var(--success);
    }

    /* ==========================================================================
       STUDY TIMER
       ========================================================================== */
    .timer-display {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.03em;
      margin: 14px 0;
      font-variant-numeric: tabular-nums;
    }

    .pill-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill-choice {
      min-height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .pill-choice.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* ==========================================================================
       CARE 7-DAY DOTS & WEEKDAY TOGGLES
       ========================================================================== */
    .dots-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
    }

    .day-dot.done { background: var(--success); color: #fff; }
    .day-dot.missed { background: var(--danger); color: #fff; }
    .day-dot.pending { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
    .day-dot.not-due { background: transparent; border: 1.5px dashed var(--border-strong); color: var(--text-muted); }

    .weekday-toggles {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .wk-btn {
      min-height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-app);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .wk-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ==========================================================================
       STATS HEATMAP & KPI GRID
       ========================================================================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .kpi-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-top: 2px;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--bg-app);
      padding: 2px;
    }

    .heat-cell.qualifies {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .heat-cell.partial {
      background: var(--accent-soft);
      border-color: rgba(37, 99, 235, 0.35);
      color: var(--accent);
    }

    .heat-cell.missed {
      background: var(--danger-soft);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }

    .heat-cell.selected {
      outline: 2px solid var(--text-primary);
      outline-offset: 1px;
    }

    /* ==========================================================================
       SETTINGS MODAL OVERLAY
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--bg-app);
      overflow-y: auto;
      padding: calc(14px + var(--safe-top)) 14px calc(32px + var(--safe-bottom));
      display: none;
    }

    .modal-overlay.open {
      display: block;
    }

    .modal-inner {
      max-width: 560px;
      margin: 0 auto;
    }

    /* ==========================================================================
       TOAST NOTIFICATIONS
       ========================================================================== */
    .toast-container {
      position: fixed;
      top: calc(14px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 28px);
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: slideDown 0.2s ease;
    }

    .toast.danger {
      background: var(--danger);
      color: #ffffff;
    }

    .toast.success {
      background: var(--success);
      color: #ffffff;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Helpers */
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .font-bold { font-weight: 700; }
    .font-semi { font-weight: 600; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
  </style>
</head>

  <script>
    /* ==========================================================================
       CONSTANTS & UTILITIES
       ========================================================================== */
    const STORAGE_KEY = 'daily_discipline_v1';
    const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
    const UNDO_WINDOW_MS = 30 * 1000;
    const GRACE_MINUTES = 60;
    const CATEGORIES = ['Study', 'Gym', 'Care', 'Diet', 'College', 'Rest'];
    const CARE_GROUPS = ['Skin care', 'Hair care', 'Diet habits', 'Other'];
    const TIME_OF_DAY_GROUPS = ['Morning', 'Night', 'Any time'];
    const WEEKDAY_SHORT = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const WEEKDAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getLocalDateKey(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDaysToKey(key, deltaDays) {
      const dt = parseDateKey(key);
      dt.setDate(dt.getDate() + deltaDays);
      return getLocalDateKey(dt);
    }

    function formatDisplayDate(key) {
      const dt = parseDateKey(key);
      return dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function timeToMinutes(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return 0;
      const [h, m] = hhmm.split(':').map(Number);
      return (h * 60) + m;
    }

    function getCurrentMinutesOfDay(dateObj = new Date()) {
      return dateObj.getHours() * 60 + dateObj.getMinutes();
    }

    function formatDurationMMSS(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    /* ==========================================================================
       WEB AUDIO CHIME (NO EXTERNAL FILES)
       ========================================================================== */
    function playDisciplineChime(urgent = false) {
      if (!state?.settings?.soundAlerts) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = urgent ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(urgent ? 520 : 660, now);
        osc.frequency.exponentialRampToValueAtTime(urgent ? 380 : 880, now + 0.22);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {
        // Ignore audio errors when autoplay is restricted
      }
    }

          ]

      const routines = [
        { id: 'r_1', name: 'Cleanser & sunscreen', group: 'Skin care', timeOfDay: 'Morning', days: [true, true, true, true, true, true, true] },

        { id: 'r_6', name: 'Hit daily protein target', group: 'Diet habits', timeOfDay: 'Any time', days: [true, true, true, true, true, true, true] },
        { id: 'r_7', name: 'In bed before 11:30 PM', group: 'Other', timeOfDay: 'Night', days: [true, true, true, true, true, true, true] }
      ];

      return {
        version: 1,
        sampleBannerDismissed: false,
        settings: {
          theme: 'system', // 'system' | 'light' | 'dark'
          strictMode: true,
          strictEnabledAt: Date.now() - (2 * 24 * 60 * 60 * 1000), // Enabled 2 days ago by default so 5d lock shown clearly

        },

        },

          {

        ],

      };
    }

    /* ==========================================================================
       STATE MANAGEMENT & PERSISTENCE
       ========================================================================== */
    let state = loadState();
    let activeTab = 'today';
    let selectedStatsDateKey = getLocalDateKey();
    let pendingConfirmKey = null;
    let pendingConfirmTimer = null;
    let wakeLockSentinel = null;
    let backupFallbackVisible = false;
    let lastDistractionBanner = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = createDefaultState();
          ensureDaySnapshot(fresh, getLocalDateKey());
          saveStateObject(fresh);
          return fresh;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') throw new Error('Invalid state');
        ensureDaySnapshot(parsed, getLocalDateKey());
        return parsed;
      } catch (e) {
        const fallback = createDefaultState();
        ensureDaySnapshot(fallback, getLocalDateKey());
        return fallback;
      }
    }

    function saveStateObject(obj) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        const warnEl = document.getElementById('storage-warning-banner');
        if (warnEl) warnEl.style.display = 'none';
        return true;
      } catch (e) {
        const warnEl = document.getElementById('storage-warning-banner');
        if (warnEl) warnEl.style.display = 'block';
        return false;
      }
    }

    function saveState() {
      // Update bestStreak before saving
      const streakStats = computeStreaks();
      if (streakStats.best > (state.bestStreak || 0)) {
        state.bestStreak = streakStats.best;
      }
      saveStateObject(state);
    }

    function applyTheme() {
      const theme = state.settings.theme || 'system';
      if (theme === 'system') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
    }

    function showToast(message, type = 'default', duration = 3400) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, duration);
    }

    function requireTwoTapConfirm(actionKey, labelPrompt) {
      if (pendingConfirmKey === actionKey) {
        pendingConfirmKey = null;
        clearTimeout(pendingConfirmTimer);
        return true;
      }
      pendingConfirmKey = actionKey;
      clearTimeout(pendingConfirmTimer);
      showToast(labelPrompt || 'Tap again within 4s to confirm', 'danger', 3800);
      renderCurrentView();
      pendingConfirmTimer = setTimeout(() => {
        pendingConfirmKey = null;
        renderCurrentView();
      }, 4000);
      return false;
    }

    /* ==========================================================================
       DAILY SNAPSHOT ENGINE (ANTI-CHEATING)
       ========================================================================== */
    function resolveScheduledTimetableId(targetState, dateKey) {
      // Check Exam Period override first
      const ep = targetState.examPeriod;
      if (ep && ep.enabled && ep.startDate && ep.endDate && ep.timetableId && targetState.timetables[ep.timetableId]) {
        if (dateKey >= ep.startDate && dateKey <= ep.endDate) {
          return ep.timetableId;
        }
      }
      const dow = parseDateKey(dateKey).getDay(); // 0..6
      const assignedId = targetState.weekdayTimetables[dow];
      if (assignedId && targetState.timetables[assignedId]) {
        return assignedId;
      }
      const firstId = Object.keys(targetState.timetables)[0];
      return firstId;
    }

    function buildSnapshotForDate(targetState, dateKey, overrideTimetableId = null) {
      const ttId = overrideTimetableId || resolveScheduledTimetableId(targetState, dateKey);
      const tt = targetState.timetables[ttId] || Object.values(targetState.timetables)[0];
      const dow = parseDateKey(dateKey).getDay();

      const blocks = (tt ? tt.blocks : [])
        .slice()
        .sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start))
        .map(b => ({
          id: b.id,
          start: b.start,
          end: b.end,
          title: b.title,
          category: b.category,
          done: false,
          doneAt: null
        }));

      const dueRoutines = (targetState.routines || [])
        .filter(r => Array.isArray(r.days) && r.days[dow])
        .map(r => ({
          id: r.id,
          name: r.name,
          group: r.group,
          timeOfDay: r.timeOfDay,
          done: false,
          doneAt: null
        }));

      return {
        dateKey,
        createdAt: Date.now(),
        timetableId: tt ? tt.id : null,
        timetableName: tt ? tt.name : 'Default',
        studyGoalMin: targetState.settings.dailyStudyGoalMin || 90,
        studyMinutesLogged: 0,
        waterGlasses: 0,
        blocks,
        routines: dueRoutines
      };
    }

    function ensureDaySnapshot(targetState, dateKey) {
      if (!targetState.days) targetState.days = {};
      if (!targetState.days[dateKey]) {
        targetState.days[dateKey] = buildSnapshotForDate(targetState, dateKey);
      }
      return targetState.days[dateKey];
    }

    function getTodaySnapshot() {
      const todayKey = getLocalDateKey();
      return ensureDaySnapshot(state, todayKey);
    }

    function canSwitchTodayTimetable(snap) {
      if (!snap) return false;
      const anyBlockDone = snap.blocks.some(b => b.done);
      const anyRoutineDone = snap.routines.some(r => r.done);
      const anyStudy = (snap.studyMinutesLogged || 0) > 0;
      return !anyBlockDone && !anyRoutineDone && !anyStudy;
    }

    function switchTodayTimetable(newTimetableId) {
      const todayKey = getLocalDateKey();
      const snap = getTodaySnapshot();
      if (!canSwitchTodayTimetable(snap)) {
        showToast('Locked: Cannot switch timetable after logging tasks or study today.', 'danger');
        return;
      }
      if (!state.timetables[newTimetableId]) return;
      const oldWater = snap.waterGlasses || 0;
      const freshSnap = buildSnapshotForDate(state, todayKey, newTimetableId);
      freshSnap.waterGlasses = oldWater;
      state.days[todayKey] = freshSnap;
      saveState();
      showToast(`Switched today to "${freshSnap.timetableName}"`, 'success');
      renderCurrentView();
    }

    /* ==========================================================================
       STRICT MODE VALIDATION & SCORING
       ========================================================================== */
    function isStrictModeLocked() {
      if (!state.settings.strictMode) return false;
      const enabledAt = state.settings.strictEnabledAt || 0;
      return (Date.now() - enabledAt) < SEVEN_DAYS_MS;
    }

    function getStrictLockRemainingText() {
      const enabledAt = state.settings.strictEnabledAt || 0;
      const remMs = Math.max(0, SEVEN_DAYS_MS - (Date.now() - enabledAt));
      const days = Math.floor(remMs / (24 * 60 * 60 * 1000));
      const hours = Math.floor((remMs % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
      return `${days}d ${hours}h remaining`;
    }

    function getBlockWindowStatus(block, dateKey) {
      const todayKey = getLocalDateKey();
      const isPast = dateKey < todayKey;
      const strict = !!state.settings.strictMode;

      if (isPast) {
        return {
          status: block.done ? 'done' : 'missed',
          canToggle: false,
          isCurrent: false,
          label: block.done ? 'Completed' : 'Missed',
          badgeClass: block.done ? 'badge-success' : 'badge-danger'
        };
      }

      const now = new Date();
      const nowMin = getCurrentMinutesOfDay(now);
      const startMin = timeToMinutes(block.start);
      let endMin = timeToMinutes(block.end);
      if (endMin < startMin) endMin += 24 * 60; // overnight safety
      const deadlineMin = endMin + GRACE_MINUTES;
      const isCurrent = nowMin >= startMin && nowMin < endMin;

      // Already ticked
      if (block.done) {
        if (!strict) {
          return { status: 'done', canToggle: true, isCurrent, label: 'Done', badgeClass: 'badge-success' };
        }
        const elapsedSinceTick = block.doneAt ? (Date.now() - block.doneAt) : Infinity;
        if (elapsedSinceTick <= UNDO_WINDOW_MS) {
          const leftSec = Math.ceil((UNDO_WINDOW_MS - elapsedSinceTick) / 1000);
          return { status: 'done', canToggle: true, isCurrent, label: `Undo (${leftSec}s)`, badgeClass: 'badge-warning' };
        }
        return { status: 'done', canToggle: false, isCurrent, label: 'Locked Done', badgeClass: 'badge-success' };
      }

      // Not ticked yet
      if (!strict) {
        return {
          status: isCurrent ? 'active' : 'open',
          canToggle: true,
          isCurrent,
          label: isCurrent ? 'Active now' : 'Open',
          badgeClass: isCurrent ? 'badge-accent' : 'badge-muted'
        };
      }

      if (nowMin < startMin) {
        return {
          status: 'upcoming',
          canToggle: false,
          isCurrent: false,
          label: `Opens ${block.start}`,
          badgeClass: 'badge-muted'
        };
      }

      if (nowMin <= deadlineMin) {
        const minsToClose = deadlineMin - nowMin;
        if (!isCurrent && minsToClose <= 20) {
          return {
            status: 'closing',
            canToggle: true,
            isCurrent: false,
            label: `Closes in ${minsToClose}m`,
            badgeClass: 'badge-warning'
          };
        }
        return {
          status: isCurrent ? 'active' : 'grace',
          canToggle: true,
          isCurrent,
          label: isCurrent ? 'Active now' : `Grace (${minsToClose}m left)`,
          badgeClass: isCurrent ? 'badge-accent' : 'badge-warning'
        };
      }

      return {
        status: 'missed',
        canToggle: false,
        isCurrent: false,
        label: 'Missed',
        badgeClass: 'badge-danger'
      };
    }

    function getRoutineStatus(routine, dateKey) {
      const todayKey = getLocalDateKey();
      const isPast = dateKey < todayKey;
      const strict = !!state.settings.strictMode;

      if (isPast) {
        return {
          canToggle: false,
          label: routine.done ? 'Done' : 'Missed',
          badgeClass: routine.done ? 'badge-success' : 'badge-danger'
        };
      }

      if (routine.done) {
        if (!strict) {
          return { canToggle: true, label: 'Done', badgeClass: 'badge-success' };
        }
        const elapsed = routine.doneAt ? (Date.now() - routine.doneAt) : Infinity;
        if (elapsed <= UNDO_WINDOW_MS) {
          const leftSec = Math.ceil((UNDO_WINDOW_MS - elapsed) / 1000);
          return { canToggle: true, label: `Undo (${leftSec}s)`, badgeClass: 'badge-warning' };
        }
        return { canToggle: false, label: 'Locked Done', badgeClass: 'badge-success' };
      }

      return { canToggle: true, label: 'Due today', badgeClass: 'badge-muted' };
    }

    function calculateDayScore(snap) {
      if (!snap) {
        return { score: 0, completed: 0, total: 1, neededForStreak: 1, studyMet: false };
      }
      const totalBlocks = snap.blocks ? snap.blocks.length : 0;
      const totalRoutines = snap.routines ? snap.routines.length : 0;
      const total = totalBlocks + totalRoutines + 1; // +1 for daily study goal

      const doneBlocks = snap.blocks ? snap.blocks.filter(b => b.done).length : 0;
      const doneRoutines = snap.routines ? snap.routines.filter(r => r.done).length : 0;
      const studyMet = (snap.studyMinutesLogged || 0) >= (snap.studyGoalMin || 90);

      const completed = doneBlocks + doneRoutines + (studyMet ? 1 : 0);
      const score = total > 0 ? Math.round((completed / total) * 100) : 0;
      const threshold = state.settings.streakThreshold || 80;
      const minRequiredItems = Math.ceil((threshold / 100) * total);
      const neededForStreak = Math.max(0, minRequiredItems - completed);

      return { score, completed, total, neededForStreak, studyMet, doneBlocks, totalBlocks, doneRoutines, totalRoutines };
    }

    function computeStreaks() {
      const todayKey = getLocalDateKey();
      const threshold = state.settings.streakThreshold || 80;
      const allKeys = Object.keys(state.days || {}).sort();

      // Calculate historical best streak across contiguous calendar days
      let best = state.bestStreak || 0;
      if (allKeys.length > 0) {
        let cursor = allKeys[0];
        let run = 0;
        while (cursor <= todayKey) {
          const snap = state.days[cursor];
          const sc = snap ? calculateDayScore(snap).score : 0;
          if (sc >= threshold) {
            run += 1;
            if (run > best) best = run;
          } else if (cursor < todayKey) {
            run = 0;
          }
          cursor = addDaysToKey(cursor, 1);
        }
      }

      // Calculate current streak walking backwards from yesterday, plus today if >= threshold
      let current = 0;
      const todaySnap = state.days[todayKey];
      const todayQualifies = todaySnap && calculateDayScore(todaySnap).score >= threshold;
      if (todayQualifies) {
        current += 1;
      }

      let checkKey = addDaysToKey(todayKey, -1);
      while (state.days[checkKey]) {
        const sc = calculateDayScore(state.days[checkKey]).score;
        if (sc >= threshold) {
          current += 1;
          checkKey = addDaysToKey(checkKey, -1);
        } else {
          break;
        }
      }

      if (current > best) best = current;
      return { current, best };
    }

    /* ==========================================================================
       DISCIPLINE NOTIFICATIONS & WARNINGS ENGINE
       ========================================================================== */
    function fireDisciplineNotification(notifId, title, body, urgent = false) {
      const todayKey = getLocalDateKey();
      if (!state.firedNotifications) state.firedNotifications = {};
      if (!state.firedNotifications[todayKey]) state.firedNotifications[todayKey] = {};
      if (state.firedNotifications[todayKey][notifId]) return;

      state.firedNotifications[todayKey][notifId] = Date.now();
      saveState();

      playDisciplineChime(urgent);
      showToast(`${title}: ${body}`, urgent ? 'danger' : 'default', 5000);

      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, { body, tag: notifId });
        } catch (e) {
          // Ignore mobile browser restriction if ServiceWorker required
        }
      }
    }

    function runDisciplineMonitor() {
      const todayKey = getLocalDateKey();
      const snap = ensureDaySnapshot(state, todayKey);
      const now = new Date();
      const nowMin = getCurrentMinutesOfDay(now);
      const strict = !!state.settings.strictMode;

      snap.blocks.forEach(b => {
        const startMin = timeToMinutes(b.start);
        let endMin = timeToMinutes(b.end);
        if (endMin < startMin) endMin += 24 * 60;
        const deadlineMin = endMin + GRACE_MINUTES;

        if (!b.done) {
          // 1. 5 minutes before block starts
          if (nowMin >= startMin - 5 && nowMin < startMin) {
            fireDisciplineNotification(
              `upcoming_${b.id}`,
              'Upcoming Block (5m)',
              `Get ready: "${b.title}" starts at ${b.start}.`,
              false
            );
          }
          // 2. Block just started
          if (nowMin >= startMin && nowMin <= startMin + 2) {
            fireDisciplineNotification(
              `start_${b.id}`,
              'Block Started',
              `Time to start: "${b.title}" (${b.start}–${b.end}).`,
              false
            );
          }
          // 3. 15 minutes before grace deadline expires
          if (strict && nowMin >= deadlineMin - 15 && nowMin < deadlineMin) {
            fireDisciplineNotification(
              `closing_${b.id}`,
              'URGENT: Window Closing',
              `Only ${deadlineMin - nowMin}m left to log "${b.title}" before it is marked Missed!`,
              true
            );
          }
          // 4. Block missed
          if (strict && nowMin > deadlineMin) {
            fireDisciplineNotification(
              `missed_${b.id}`,
              'MISSED BLOCK',
              `You missed "${b.title}". Stay locked in on remaining tasks!`,
              true
            );
          }
        }
      });

      // 5. Evening streak protection check (21:00 or later)
      if (nowMin >= 21 * 60) {
        const stats = calculateDayScore(snap);
        if (stats.neededForStreak > 0) {
          fireDisciplineNotification(
            'evening_streak_warn',
            'Streak at Risk!',
            `Complete ${stats.neededForStreak} more item(s) before midnight to hit ${state.settings.streakThreshold}%!`,
            true
          );
        }
      }
    }

    function getActiveWarningsList(snap) {
      const warnings = [];
      const todayKey = getLocalDateKey();
      const nowMin = getCurrentMinutesOfDay();
      const strict = !!state.settings.strictMode;
      const stats = calculateDayScore(snap);

      // Distraction banner from study session
      if (lastDistractionBanner) {
        warnings.push({
          type: 'urgent',
          text: lastDistractionBanner,
          actionLabel: 'Dismiss',
          actionFn: 'dismissDistractionBanner()'
        });
      }

      // Expiring blocks within 20 minutes
      if (strict) {
        snap.blocks.forEach(b => {
          if (b.done) return;
          const startMin = timeToMinutes(b.start);
          let endMin = timeToMinutes(b.end);
          if (endMin < startMin) endMin += 24 * 60;
          const deadlineMin = endMin + GRACE_MINUTES;
          if (nowMin > endMin && nowMin <= deadlineMin && (deadlineMin - nowMin) <= 25) {
            warnings.push({
              type: 'urgent',
              text: `Expiring soon: "${b.title}" closes in ${deadlineMin - nowMin} min!`
            });
          }
        });

        const missedCount = snap.blocks.filter(b => !b.done && nowMin > (timeToMinutes(b.end) + GRACE_MINUTES)).length;
        if (missedCount > 0) {
          warnings.push({
            type: 'urgent',
            text: `${missedCount} timetable block${missedCount > 1 ? 's' : ''} missed today. Protect your streak on remaining items!`
          });
        }
      }

      // Evening warning if streak not safe
      if (nowMin >= 19 * 60 + 30 && stats.neededForStreak > 0) {
        warnings.push({
          type: 'warn',
          text: `Evening Discipline Check: Complete ${stats.neededForStreak} more item(s) today to reach ${state.settings.streakThreshold}%.`
        });
      }

      // Browser notification permission prompt if default
      if ('Notification' in window && Notification.permission === 'default') {
        warnings.push({
          type: 'info',
          text: 'Enable browser alerts so Daily Discipline can warn you before tasks expire.',
          actionLabel: 'Enable Alerts',
          actionFn: 'requestBrowserNotifications()'
        });
      }

      return warnings;
    }

    function dismissDistractionBanner() {
      lastDistractionBanner = null;
      renderCurrentView();
    }

    async function requestBrowserNotifications() {
      if (!('Notification' in window)) {
        showToast('Browser notifications not supported on this device.', 'danger');
        return;
      }
      try {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          showToast('Discipline alerts enabled!', 'success');
          playDisciplineChime(false);
        } else {
          showToast('Notification permission denied by browser.', 'danger');
        }
        renderCurrentView();
      } catch (e) {
        showToast('Could not request notification permission.', 'danger');
      }
    }

    /* ==========================================================================
       FOCUS TIMER & PAGE VISIBILITY ANTI-CHEATING
       ========================================================================== */
    function getElapsedTimerMs() {
      const t = state.activeTimer;
      if (!t) return 0;
      if (!t.running || !t.startedAt) return t.accumulatedMs || 0;
      return (t.accumulatedMs || 0) + Math.max(0, Date.now() - t.startedAt);
    }

    async function engageWakeLock() {
      if ('wakeLock' in navigator && !wakeLockSentinel) {
        try {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        } catch (e) {
          // Wake lock might fail on low battery or unsupported webviews
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLockSentinel) {
        try {
          wakeLockSentinel.release();
        } catch (e) {}
        wakeLockSentinel = null;
      }
    }

    function startFocusTimer() {
      const t = state.activeTimer;
      if (t.running) return;
      t.running = true;
      t.startedAt = Date.now();
      t.lastHiddenAt = null;
      saveState();
      engageWakeLock();
      renderCurrentView();
    }

    function pauseFocusTimer() {
      const t = state.activeTimer;
      if (!t.running) return;
      t.accumulatedMs = getElapsedTimerMs();
      t.running = false;
      t.startedAt = null;
      saveState();
      releaseWakeLock();
      renderCurrentView();
    }

    function finishFocusTimer(autoCompleted = false) {
      const t = state.activeTimer;
      const elapsedMs = getElapsedTimerMs();
      const elapsedSec = Math.floor(elapsedMs / 1000);
      const strict = !!state.settings.strictMode;

      t.running = false;
      t.startedAt = null;
      t.accumulatedMs = 0;
      t.lastHiddenAt = null;
      releaseWakeLock();

      if (strict && elapsedSec < 300) {
        const distractions = t.distractions || 0;
        t.distractions = 0;
        saveState();
        playDisciplineChime(true);
        showToast(`Discarded (${Math.floor(elapsedSec / 60)}m ${elapsedSec % 60}s): Sessions under 5 min are not logged in Strict Mode.`, 'danger', 4800);
        renderCurrentView();
        return;
      }

      const loggedMin = Math.max(1, Math.round(elapsedSec / 60));
      const todayKey = getLocalDateKey();
      const snap = getTodaySnapshot();
      snap.studyMinutesLogged = (snap.studyMinutesLogged || 0) + loggedMin;

      state.studySessions.push({
        id: uid('sess'),
        dateKey: todayKey,
        semesterId: state.activeSemesterId,
        subjectId: t.subjectId,
        minutes: loggedMin,
        distractions: t.distractions || 0,
        endedAt: Date.now()
      });

      t.distractions = 0;
      saveState();
      playDisciplineChime(false);
      showToast(
        autoCompleted
          ? `Focus block complete! +${loggedMin} min logged.`
          : `Session saved: +${loggedMin} min logged.`,
        'success',
        4200
      );
      renderCurrentView();
    }

    function resetFocusTimer() {
      if (!requireTwoTapConfirm('reset_timer', 'Tap Reset again to discard current timer')) return;
      state.activeTimer.running = false;
      state.activeTimer.startedAt = null;
      state.activeTimer.accumulatedMs = 0;
      state.activeTimer.distractions = 0;
      state.activeTimer.lastHiddenAt = null;
      releaseWakeLock();
      saveState();
      showToast('Timer discarded');
      renderCurrentView();
    }

    document.addEventListener('visibilitychange', () => {
      const t = state.activeTimer;
      if (!t || !t.running) return;

      if (document.hidden) {
        t.lastHiddenAt = Date.now();
        saveState();
      } else {
        engageWakeLock();
        if (t.lastHiddenAt) {
          const hiddenMs = Date.now() - t.lastHiddenAt;
          t.lastHiddenAt = null;
          if (state.settings.strictMode && hiddenMs > 45000) {
            // Deduct hidden duration from elapsed study time
            const currentTotal = getElapsedTimerMs();
            const adjusted = Math.max(0, currentTotal - hiddenMs);
            t.accumulatedMs = adjusted;
            t.startedAt = Date.now();
            t.distractions = (t.distractions || 0) + 1;
            const hiddenSec = Math.round(hiddenMs / 1000);
            lastDistractionBanner = `Distraction detected! You left the app for ${hiddenSec}s. Time deducted & +1 distraction logged.`;
            playDisciplineChime(true);
            showToast(lastDistractionBanner, 'danger', 6000);
          }
          saveState();
          renderCurrentView();
        }
      }
    });

    /* ==========================================================================
       NAVIGATION & VIEW RENDERING
       ========================================================================== */
    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function openSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('open');
      renderSettings();
    }

    function closeSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('open');
      renderCurrentView();
    }

    function renderCurrentView() {
      const app = document.getElementById('app');
      if (!app) return;
      ensureDaySnapshot(state, getLocalDateKey());

      switch (activeTab) {
        case 'today': app.innerHTML = renderTodayTab(); break;
        case 'study': app.innerHTML = renderStudyTab(); break;
        case 'body': app.innerHTML = renderBodyTab(); break;
        case 'care': app.innerHTML = renderCareTab(); break;
        case 'plan': app.innerHTML = renderPlanTab(); break;
        case 'stats': app.innerHTML = renderStatsTab(); break;
      }

      if (document.getElementById('settings-modal').classList.contains('open')) {
        renderSettings();
      }
    }

                </span>

              </div>
            `).join('')}
          </div>
        ` : ''}

        <section class="card">
          <div class="row-between mb-2">
            <div class="card-title" style="font-size:15px;">
              📚 Daily Study Goal

            <span class="badge ${scoreInfo.studyMet ? 'badge-success' : 'badge-accent'}">
              ${studyLogged} / ${studyGoal} min
            </span>
          </div>
          <div class="progress-track mb-2">
            <div class="progress-fill ${scoreInfo.studyMet ? 'success' : ''}" style="width:${studyPct}%"></div>
          </div>
          <div class="row-between">
            <span class="text-xs text-muted">
              ${scoreInfo.studyMet ? 'Counts +1 toward today’s score!' : `${studyGoal - studyLogged} min remaining to earn today’s study point`}
            </span>
            <button class="btn btn-sm btn-primary" onclick="switchTab('study')">Focus Timer &rarr;</button>
          </div>

        <!-- Today's Timetable -->
        <section class="card">
          <div class="card-header" style="flex-wrap:wrap;">
            <div>
              <h2 class="card-title">Today's Timetable</h2>
              <div class="text-xs text-muted mt-1">Active: <strong>${escapeHtml(snap.timetableName)}</strong></div>
            </div>
            <div>
              <select
                class="select"
                style="min-height:38px; padding:4px 10px; font-size:13px;"
                ${canSwitchTT ? '' : 'disabled'}
                onchange="switchTodayTimetable(this.value)"
                title="${canSwitchTT ? 'Switch timetable mode for today' : 'Locked once any task or study time is logged today'}"
              >
                ${Object.values(state.timetables).map(tt => `
                  <option value="${tt.id}" ${tt.id === snap.timetableId ? 'selected' : ''}>${escapeHtml(tt.name)}</option>
                `).join('')}
              </select>
            </div>
          </div>
          ${!canSwitchTT ? `<div class="text-xs text-muted mb-2">🔒 Mode locked because activity has started today.</div>` : ''}
          <div>
            ${snap.blocks.map(b => {
              const win = getBlockWindowStatus(b, todayKey);
              return `
                <div class="block-row ${win.isCurrent ? 'is-current' : ''} ${b.done ? 'is-done' : ''} ${win.status === 'missed' ? 'is-missed' : ''}">
                  <div style="min-width:0; flex:1;">
                    <div class="row" style="gap:6px; flex-wrap:wrap;">
                      <span class="text-xs font-bold text-secondary">${b.start} – ${b.end}</span>
                      <span class="badge cat-${b.category}">${b.category}</span>
                      <span class="badge ${win.badgeClass}">${win.label}</span>
                    </div>
                    <div class="block-title font-semi mt-1">${escapeHtml(b.title)}</div>
                  </div>
                  <button
                    class="check-btn ${b.done ? 'checked' : ''}"
                    ${win.canToggle ? '' : 'disabled'}
                    onclick="toggleTodayBlock('${b.id}')"
                    aria-label="Mark ${escapeHtml(b.title)} done"
                  >
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                  </button>
